# TSword on the PS5 (UltraTears): the settings, as ultratears.cfg on the PC (name=value; the launcher's names).
# The game files (exefs, romfs, shaders, textures, fonts) are found on their own: TSword/ on a USB drive or extended
# storage, the title folder, or the folder named in game-files.txt. A line here wins over that.
#
# the TV's picture: 1920x1080 (or 2560x1440, 3840x2160); scale is the game's 3D resolution in % of it (the game's own
# 5/6 when unset), sharpened by FSR 1 (upscale=bilinear turns it off)
resolution=1920x1080
window=fullscreen
vsync=1
# frames per second: 30 is the game's own; 60 when the console keeps up
fps=30
# the game's A on cross (the PS5's confirm button) and B on circle; pad_layout=nintendo puts A on circle as on a Switch
pad_layout=xbox
# the write watch (which textures the game changed): on; TOTK_WRITE_WATCH=0 turns it off (every texture is then
# compared by its contents, as before 0.4.1) - if the picture shows old textures that should have changed, try it
#TOTK_WRITE_WATCH=0
# (0.4.3) the GPU's descriptors: sets on the PS5; TOTK_VK_DESCRIPTOR_SETS=0 tries descriptor buffers (the PC's way)
#TOTK_VK_DESCRIPTOR_SETS=0
# (0.4.3) a GPU that stops for 8 s ends TSword with a log line, before it can lock the console up; 0: wait forever
#TOTK_GPU_WATCHDOG=0
# GPU markers: if TSword stops on the GPU, gpu_marks=1 makes the log name the commands it was running (a little slower)
#gpu_marks=1
